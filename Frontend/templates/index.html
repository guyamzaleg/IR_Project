<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&M Search Motors - Exclusive Search Experience</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-pattern"></div>
    
    <header class="header">
        <div class="logo-container">
            <div class="logo">GM</div>
            <div class="brand-name">SEARCH MOTORS</div>
        </div>
        <div class="tagline">PRECISION • POWER • PERFORMANCE</div>
    </header>
    
    <div class="container">
        <div class="search-section">
            <div class="search-label">ENTER YOUR QUERY</div>
            <div class="search-mode-selector">
                <label class="mode-option">
                    <input type="radio" name="searchMode" value="search" checked>
                    <span>HYBRID SEARCH</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="searchMode" value="search_body">
                    <span>BODY ONLY</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="searchMode" value="search_title">
                    <span>TITLE ONLY</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="searchMode" value="search_anchor">
                    <span>ANCHOR TEXT</span>
                </label>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="What knowledge are you seeking?" autofocus>
                <button id="searchBtn">
                    <span class="btn-text">ENGAGE</span>
                    <span class="btn-icon">→</span>
                </button>
            </div>
            <div class="search-options">
                <label class="option-toggle">
                    <input type="checkbox" id="showPageRank" checked>
                    <span>Show PageRank</span>
                </label>
                <label class="option-toggle">
                    <input type="checkbox" id="showPageViews" checked>
                    <span>Show PageViews</span>
                </label>
            </div>
        </div>
        
        <div id="results"></div>
    </div>
    
    <footer class="footer">
        <div class="footer-text">G&M SEARCH MOTORS™ | Est. 2025 | Engineered for Excellence</div>
    </footer>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
